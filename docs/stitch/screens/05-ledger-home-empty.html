</head><body class="bg-surface font-body-lg text-on-surface relative min-h-screen"><div aria-hidden="true" class="fixed top-0 bottom-0 left-[3.25rem] w-[5px] pointer-events-none z-10 flex gap-[3px] select-none"><div class="w-px h-full bg-secondary opacity-80"></div><div class="w-px h-full bg-secondary opacity-80"></div></div><main class="flex flex-col relative w-full min-h-screen bg-surface pl-16 pr-4 pt-safe pb-safe"><div class="flex flex-col w-full pb-8">

<span class="block font-headline-lg text-headline-lg text-primary mt-0.5 tabular-nums">₹0</span>
</div>

<div class="px-2.5 py-2 border-r border-outline-variant">
<span class="block font-label-mono text-label-mono text-on-surface-variant uppercase">REPAID</span>
<span class="block font-headline-lg text-headline-lg text-primary mt-0.5 tabular-nums">₹0</span>
</div>
<!-- Col 3: Overdue -->
<div class="px-2.5 py-2">
<span class="block font-label-mono text-label-mono text-on-surface-variant uppercase">OVERDUE</span>

</div></div>
</div>

<div class="h-12 w-full"></div>
<div class="h-12 w-full"></div>
<div class="h-12 w-full"></div>

<span class="material-symbols-outlined text-base leading-none">add</span>

</button>
</div>
</div>
<script>
  // Simple filter tab switching
  const tabs = document.querySelectorAll('.tab-btn');
  const items = document.querySelectorAll('.ledger-item');

  tabs.forEach(tab => {
    tab.addEventListener('click', () => {
      tabs.forEach(t => {
        t.classList.remove('border-primary', 'text-primary');
        t.classList.add('border-transparent', 'text-on-surface-variant');
      });
      tab.classList.remove('border-transparent', 'text-on-surface-variant');
      tab.classList.add('border-primary', 'text-primary');

      const filter = tab.textContent.trim().toLowerCase();
      items.forEach(item => {
        if (filter === 'all' || item.dataset.status === filter) {
          item.style.display = 'flex';
        } else {
          item.style.display = 'none';
        }
      });
    });
  });
</script></main></body></html>
