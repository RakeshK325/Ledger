<!DOCTYPE html>

<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/><meta content="mobile_blank" name="shell-type"/><link href="https://fonts.googleapis.com" rel="preconnect"/><link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/><link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&amp;family=IBM+Plex+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/><script src="https://cdn.tailwindcss.com"></script><script id="tailwind-config">tailwind.config = { darkMode: 'class', theme: { extend: { colors: { 'on-background': '#1e1b13', 'secondary-container': '#fd7362', 'surface-container-highest': '#e9e2d3', 'surface-container-low': '#faf3e4', 'on-primary': '#ffffff', 'surface-variant': '#e9e2d3', 'error-container': '#ffdad6', 'on-primary-fixed': '#1d1b18', 'background': '#fff9ee', 'tertiary-fixed': '#b1f0cd', 'primary-fixed-dim': '#cac6c1', 'primary-container': '#1d1b18', 'inverse-primary': '#cac6c1', 'surface-tint': '#605e5a', 'tertiary': '#000000', 'on-tertiary-container': '#549071', 'outline': '#7a776f', 'on-tertiary': '#ffffff', 'secondary': '#aa352a', 'surface-container-high': '#eee8d9', 'secondary-fixed-dim': '#ffb4a9', 'outline-variant': '#cac6bd', 'on-secondary-fixed': '#410001', 'surface-container-lowest': '#ffffff', 'primary-fixed': '#e6e2dc', 'primary': '#000000', 'on-surface': '#1e1b13', 'on-secondary-fixed-variant': '#891d16', 'tertiary-fixed-dim': '#96d4b2', 'on-tertiary-fixed': '#002113', 'on-secondary-container': '#6f0806', 'on-error-container': '#93000a', 'inverse-surface': '#333026', 'on-primary-fixed-variant': '#484743', 'inverse-on-surface': '#f7f0e1', 'on-secondary': '#ffffff', 'error': '#ba1a1a', 'on-error': '#ffffff', 'on-primary-container': '#86837f', 'surface-bright': '#fff9ee', 'surface-dim': '#e0d9cb', 'surface-container': '#f4edde', 'secondary-fixed': '#ffdad5', 'on-tertiary-fixed-variant': '#105137', 'on-surface-variant': '#494740', 'surface': '#fff9ee', 'tertiary-container': '#002113' }, borderRadius: { 'DEFAULT': '0.25rem', 'lg': '0.5rem', 'xl': '0.75rem', 'full': '9999px' }, spacing: { 'gutter': '1rem', 'margin-md': '2rem', 'margin': '1rem', 'space-lg': '1.5rem', 'space-xl': '2rem', 'margin-lg': '3rem', 'gutter-lg': '1.5rem', 'space-md': '1rem', 'space-xs': '0.25rem', 'space-sm': '0.5rem' }, fontFamily: { 'label-mono': ['IBM Plex Mono'], 'body-sm': ['EB Garamond'], 'stamp-lg': ['IBM Plex Mono'], 'headline-xl': ['EB Garamond'], 'mono-data': ['IBM Plex Mono'], 'headline-xl-mobile': ['EB Garamond'], 'body-lg': ['EB Garamond'], 'mono-header': ['IBM Plex Mono'], 'headline-lg': ['EB Garamond'], 'stamp-sm': ['IBM Plex Mono'], 'caption-mono': ['IBM Plex Mono'] }, fontSize: { 'label-mono': ['12px', { lineHeight: '16px', letterSpacing: '0.06em', fontWeight: '500' }], 'body-sm': ['14px', { lineHeight: '20px', fontWeight: '400' }], 'stamp-lg': ['22px', { lineHeight: '24px', letterSpacing: '0.14em', fontWeight: '700' }], 'headline-xl': ['34px', { lineHeight: '40px', letterSpacing: '-0.01em', fontWeight: '600' }], 'mono-data': ['14px', { lineHeight: '20px', letterSpacing: '0em', fontWeight: '400' }], 'headline-xl-mobile': ['22px', { lineHeight: '28px', letterSpacing: '0em', fontWeight: '600' }], 'body-lg': ['16px', { lineHeight: '24px', fontWeight: '400' }], 'mono-header': ['14px', { lineHeight: '18px', letterSpacing: '0.08em', fontWeight: '600' }], 'headline-lg': ['22px', { lineHeight: '28px', letterSpacing: '0em', fontWeight: '500' }], 'stamp-sm': ['14px', { lineHeight: '16px', letterSpacing: '0.12em', fontWeight: '700' }], 'caption-mono': ['12px', { lineHeight: '14px', letterSpacing: '0.02em', fontWeight: '400' }] } } } };</script><style>@layer base { html, body { width: 100%; min-height: 100%; margin: 0; padding: 0; background-color: #F3ECDD; } .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); } .pt-safe { padding-top: env(safe-area-inset-top, 0px); } main > :first-child { margin-top: 0 !important; } main > :last-child { margin-bottom: 0 !important; } } ::-webkit-scrollbar { display: none; } .ledger-ruled-bg { background-color: #F3ECDD; background-image: linear-gradient(to bottom, #CBD5CF 1px, transparent 1px); background-size: 100% 36px; } .double-margin-rule { position: fixed; top: 0; bottom: 0; left: 3rem; width: 5px; pointer-events: none; z-index: 20; display: flex; justify-content: space-between; } .double-margin-rule::before, .double-margin-rule::after { content: ''; width: 1px; height: 100%; background-color: #C2473A; opacity: 0.85; }</style><style>

  </head><body class="bg-surface font-body-lg text-body-lg text-on-surface antialiased relative min-h-screen"><div aria-hidden="true" class="double-margin-rule"></div><main class="flex flex-col relative w-full min-h-screen ledger-ruled-bg bg-surface pt-safe pb-safe pl-[3.75rem] pr-margin"><div class="flex flex-col w-full relative">
<!-- Top Navigation & Audit Header -->
<div class="flex flex-col w-full pb-space-sm">
<div class="flex items-center justify-between w-full pt-space-xs">
<button class="font-mono-header text-mono-header text-primary uppercase tracking-wider hover:opacity-70 transition-opacity" type="button">
        [ Cancel ]
      </button>
<div class="inline-flex items-center px-space-sm py-0.5 border-2 border-secondary rotate-[-6deg] select-none">
<span class="font-stamp-sm text-stamp-sm text-secondary uppercase tracking-[0.14em]">AUDIT REJECTED</span>
</div>
</div>
<div class="flex items-baseline justify-between mt-space-sm">
<h1 class="font-headline-xl-mobile text-headline-xl-mobile text-on-surface">New entry</h1>
<span class="font-label-mono text-label-mono text-secondary uppercase tracking-widest">
        FOLIO NO. 04 · ENTRY REJECTED
      </span>
</div>
</div>
<!-- Physical Divider Rule -->
<div class="w-full h-[1.5px] bg-primary mb-space-lg"></div>
<!-- Primary Journal Entry Sheet / Form Container -->
<div class="flex flex-col w-full space-y-space-lg">
<!-- Field 1: Friend Name (Validation Deficit) -->
<div class="flex flex-col w-full">
<label class="font-label-mono text-label-mono text-secondary uppercase mb-1" for="friend-name">
        FRIEND NAME
      </label>
<div class="relative w-full">
<input aria-describedby="friend-name-error" aria-invalid="true" class="w-full bg-transparent border-0 border-b-2 border-secondary rounded-none py-1.5 px-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline-variant focus:outline-none focus:ring-0 focus:border-secondary" id="friend-name" placeholder="Party of the second part..." type="text" value=""/>
</div>
<p class="font-caption-mono text-caption-mono text-secondary mt-1.5 tracking-wide" id="friend-name-error">
        Put a name on it.
      </p>
</div>
<!-- Field 2: Amount (Validation Deficit) -->
<div class="flex flex-col w-full">
<label class="font-label-mono text-label-mono text-secondary uppercase mb-1" for="transaction-amount">
        AMOUNT
      </label>
<div class="relative w-full flex items-baseline">
<span class="font-headline-xl text-headline-xl text-secondary select-none mr-2">₹</span>
<input aria-describedby="amount-error" aria-invalid="true" class="w-full bg-transparent border-0 border-b-2 border-secondary rounded-none py-0 px-0 font-headline-xl text-headline-xl text-secondary focus:outline-none focus:ring-0 focus:border-secondary" id="transaction-amount" type="text" value="0"/>
</div>
<p class="font-caption-mono text-caption-mono text-secondary mt-1.5 tracking-wide" id="amount-error">
        Amount must be more than zero.
      </p>
</div>
<!-- Field 3: Due Date -->
<div class="flex flex-col w-full">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase mb-1">
        DUE DATE
      </label>
<div class="flex items-center justify-between w-full border-b-[1.5px] border-primary py-2">
<span class="font-mono-data text-mono-data text-on-surface">Sat, 31 Oct 2026</span>
<button class="font-label-mono text-label-mono text-on-surface underline uppercase hover:opacity-70" type="button">
          Change
        </button>
</div>
</div>
<!-- Field 4: Receipt (Optional Attachment) -->
<div class="flex flex-col w-full">
<label class="font-label-mono text-label-mono text-on-surface-variant uppercase mb-1.5">
        RECEIPT (OPTIONAL)
      </label>
<div class="flex items-center justify-between w-full p-space-sm bg-surface-container border-[1.5px] border-primary rounded-[2px]">
<div class="flex items-center space-x-2">
<span class="material-symbols-outlined text-primary text-[20px]">attach_file</span>
<span class="font-mono-header text-mono-header text-primary uppercase">Attach photo</span>
</div>
<span class="font-caption-mono text-caption-mono text-on-surface-variant">.jpg .png .webp · max 5 MB</span>
</div>
</div>
</div>
<!-- Bottom Execution Block -->
<div class="flex flex-col w-full mt-margin-md pt-space-md border-t-[1.5px] border-primary">
<button class="w-full py-3.5 bg-primary text-background font-mono-header text-mono-header uppercase tracking-wider rounded-[2px] border-[1.5px] border-primary active:translate-x-[1px] active:translate-y-[1px] transition-transform flex items-center justify-center space-x-2" type="button">
<span>Write it down</span>
</button>
<div class="flex items-center justify-center space-x-1.5 mt-space-sm">
<span class="w-1.5 h-1.5 bg-secondary inline-block"></span>
<p class="font-caption-mono text-caption-mono text-secondary uppercase tracking-widest text-center">
        CORRECT DISCREPANCIES BEFORE FOLIO RECORDING
      </p>
<span class="w-1.5 h-1.5 bg-secondary inline-block"></span>
</div>
</div>
</div></main></body></html>
